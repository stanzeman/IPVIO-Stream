# Fork only: keeps this fork up to date with Emrodev/IPVIO-Stream (main) and carries the portal, categories-fix and my-build branches along.
# Stops with an error (and a mail from GitHub) if a merge conflicts. Not part of the upstream project.
name: Sync with upstream

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.repository == 'stanzeman/IPVIO-Stream'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Merge upstream main into main and into the carried branches
        run: |
          git config user.name "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          git remote add upstream https://github.com/Emrodev/IPVIO-Stream.git
          git fetch upstream main
          # "[skip ci]" keeps the upstream build and release workflows from running on this fork
          git merge --no-ff --no-edit -m "Sync with upstream main [skip ci]" upstream/main || { git merge --abort; echo "Conflict on main"; exit 1; }
          git push origin main
          FAILED=""
          for BR in feat/T-036-vportal-source fix/T-037-extgrp-categories feat/T-053-epg-name-match feat/T-054-portal-incremental feat/T-055-epg-cache-logos feat/T-056-cyrillic-keyboard feat/T-057-portal-search feat/T-058-also-show feat/T-059-epg-background my-build; do
            if git ls-remote --exit-code --heads origin "$BR" >/dev/null; then
              git fetch origin "$BR"
              git checkout -q -B "$BR" "origin/$BR"
              if git merge --no-ff --no-edit -m "Merge upstream main [skip ci]" upstream/main; then
                git push origin "$BR"
              else
                git merge --abort; echo "Conflict on $BR"; FAILED="$FAILED $BR"
              fi
            fi
          done
          if [ -n "$FAILED" ]; then echo "Conflicts on:$FAILED"; exit 1; fi
